<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Student Attendance - Wadia College</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/js/locationHandler.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      font-family: 'DM Sans', sans-serif;
    }
    
    .serif {
      font-family: 'DM Serif Display', serif;
    }

    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      background: linear-gradient(135deg, #0B1F3A 0%, #122844 100%);
      color: #FFFFFF;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse 60% 50% at 20% 80%, rgba(30, 111, 217, 0.08) 0%, transparent 70%),
                  radial-gradient(ellipse 50% 40% at 80% 20%, rgba(232, 160, 32, 0.06) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image: radial-gradient(circle, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    .container-content {
      position: relative;
      z-index: 1;
    }

    .btn-primary {
      padding: 0.75rem 1rem;
      background: #E8A020;
      border: 1px solid rgba(232, 160, 32, 0.3);
      color: #0B1F3A;
      border-radius: 0.5rem;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 4px 15px rgba(232, 160, 32, 0.3);
    }
    
    .btn-primary:hover {
      background: #F5B940;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(232, 160, 32, 0.4);
    }
    
    .btn-primary:active {
      transform: scale(0.98);
    }

    .btn-secondary {
      padding: 0.5rem 0.75rem;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: white;
      border-radius: 0.5rem;
      font-size: 0.875rem;
      cursor: pointer;
      transition: all 0.3s;
    }
    
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(232, 160, 32, 0.5);
    }

    .card {
      background: rgba(18, 40, 68, 0.35);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 1rem;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2), inset 0 1px 2px rgba(255, 255, 255, 0.08);
    }
    
    @media (min-width: 640px) {
      .card {
        padding: 1.5rem;
      }
    }

    .input-field {
      width: 100%;
      padding: 0.75rem 1rem;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 0.5rem;
      color: white;
      font-size: 1rem;
      transition: all 0.3s;
    }
    
    .input-field:focus {
      outline: none;
      border-color: #E8A020;
      background: rgba(232, 160, 32, 0.1);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    input::placeholder {
      color: rgba(138, 155, 181, 0.7);
    }

    .stat-value {
      @apply text-3xl sm:text-4xl font-bold text-yellow-400;
    }

    .stat-label {
      @apply text-xs sm:text-sm text-gray-400 mt-2;
    }

    /* Prevent iOS zoom on input focus */
    input, select, textarea {
      font-size: 16px !important;
    }

    @media (max-width: 500px) {
      body {
        padding-top: 0;
      }
      .card {
        @apply p-3;
      }
      .serif {
        font-size: 1.25rem;
      }
    }
  </style>
</head>
<body>
  <div class="container-content min-h-screen flex flex-col">
    <!-- Header -->
    <header class="border-b border-white/10 p-4 sm:p-6">
      <div class="flex items-center justify-between gap-4">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 sm:w-12 sm:h-12 bg-yellow-500 rounded-lg flex items-center justify-center flex-shrink-0">
            <svg class="w-5 h-5 sm:w-6 sm:h-6" viewBox="0 0 26 26" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M13 4L2 10l11 6 11-6-11-6z" fill="#0B1F3A" stroke="#0B1F3A" stroke-linejoin="round"/>
              <path d="M6 13v5c0 2.5 3 4 7 4s7-1.5 7-4v-5" stroke="#0B1F3A" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
          </div>
          <div class="flex-1 min-w-0">
            <div class="text-xs font-bold text-yellow-400 uppercase tracking-wide">Wadia</div>
            <div class="text-sm sm:text-base font-semibold truncate">Attendance</div>
          </div>
        </div>
        <button onclick="logout()" class="btn-secondary text-xs sm:text-sm">Logout</button>
      </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 p-4 sm:p-6 space-y-4 sm:space-y-6">
      
      <!-- Mark Attendance Section -->
      <section class="card">
        <h2 class="serif text-lg sm:text-xl text-yellow-400 mb-3 sm:mb-4">Mark Attendance</h2>
        <p class="text-xs sm:text-sm text-gray-400 mb-4">Enter the 5-digit code from your teacher:</p>
        <div class="flex flex-col sm:flex-row gap-3">
          <input 
            type="text" 
            id="codeInput" 
            class="input-field flex-1"
            placeholder="00000"
            maxlength="5"
            pattern="[0-9]{5}"
            inputmode="numeric"
          >
          <button onclick="markAttendance()" class="btn-primary w-full sm:w-auto whitespace-nowrap text-sm sm:text-base">
            Mark
          </button>
          <script src="/js/locationHandler.js"></script>

<script>
  // Hook into attendance form submission
  async function handleAttendanceSubmit(event) {
    event.preventDefault();
    
    const form = event.target;
    const codeInput = form.querySelector('[name="code"]') || form.querySelector('[name="attendance_code"]');
    const sessionInput = form.querySelector('[name="sessionId"]') || form.querySelector('[name="session_id"]');
    const submitBtn = form.querySelector('button[type="submit"]');
    
    if (!codeInput || !sessionInput) {
      console.error('Form inputs not found');
      return;
    }
    
    const code = codeInput.value;
    const sessionId = sessionInput.value;
    
    submitBtn.disabled = true;
    submitBtn.innerHTML = '📍 Verifying your location...';
    
    try {
      console.log('Getting location...');
      const location = await locationHandler.getCurrentLocation();
      console.log('Location obtained:', location);
      
      console.log('Validating location with teacher...');
      const validation = await locationHandler.validateAttendanceLocation(
        sessionId,
        location.latitude,
        location.longitude,
        location.accuracy
      );
      console.log('Validation result:', validation);
      
      if (!validation.isValid) {
        alert(`❌ ${validation.error}`);
        submitBtn.disabled = false;
        submitBtn.innerHTML = 'Mark Attendance';
        return;
      }
      
      submitBtn.innerHTML = '✅ Location verified! Marking attendance...';
      
      // Call your existing mark-attendance API
      const response = await fetch('/api/mark-attendance', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({
          code: code,
          sessionId: sessionId,
          latitude: location.latitude,
          longitude: location.longitude,
          accuracy: location.accuracy
        })
      });
      
      const result = await response.json();
      
      if (response.ok) {
        alert('✅ Attendance marked successfully!');
        location.reload();
      } else {
        alert(`❌ ${result.error}`);
      }
      
    } catch (error) {
      console.error('Error:', error);
      alert(`❌ Error: ${error.message}`);
    } finally {
      submitBtn.disabled = false;
      submitBtn.innerHTML = 'Mark Attendance';
    }
  }
  
  // Find your attendance form and attach the handler
  document.addEventListener('DOMContentLoaded', function() {
    const attendanceForm = document.querySelector('form[data-form="attendance"]') 
                        || document.querySelector('form')
                        || document.querySelector('[data-attendance-form]');
    
    if (attendanceForm) {
      attendanceForm.addEventListener('submit', handleAttendanceSubmit);
      console.log('Attendance form handler attached');
    }
  });
</script>
        </div>
      </section>

      <!-- Stats Grid -->
      <section class="grid grid-cols-2 gap-3 sm:gap-4">
        <div class="card text-center">
          <div class="stat-value" id="monthlyPct">--%</div>
          <div class="stat-label">Monthly</div>
        </div>
        <div class="card text-center">
          <div class="stat-value" id="livePct">--%</div>
          <div class="stat-label">Overall</div>
        </div>
      </section>

      <!-- Attendance Detail -->
      <div id="monthlyDetail" class="text-xs sm:text-sm text-gray-400 text-center">Loading attendance details...</div>

      <!-- Recent Attendance -->
      <section class="card">
        <h2 class="serif text-lg sm:text-xl text-yellow-400 mb-3 sm:mb-4">Recent Attendance</h2>
        <div id="myAttendance" class="space-y-2 sm:space-y-3">
          <p class="text-xs sm:text-sm text-gray-400">Loading...</p>
        </div>
      </section>

      <!-- Session History -->
      <section class="card">
        <h2 class="serif text-lg sm:text-xl text-yellow-400 mb-3 sm:mb-4">Session History</h2>
        <div id="sessionHistory" class="overflow-x-auto -mx-4 sm:-mx-6 px-4 sm:px-6">
          <p class="text-xs sm:text-sm text-gray-400">Loading session history...</p>
        </div>
      </section>

      <!-- Assignments -->
      <section class="card pb-8 sm:pb-10">
        <h2 class="serif text-lg sm:text-xl text-yellow-400 mb-3 sm:mb-4">Assignments</h2>
        <div id="assignmentList" class="space-y-2 sm:space-y-3">
          <p class="text-xs sm:text-sm text-gray-400">Loading assignments...</p>
        </div>
      </section>

    </main>
  </div>

  <script>
    // Check session on load
    fetch('/check-session', { credentials: 'same-origin' }).then(res => res.json()).then(data => {
      if (!data.loggedIn || data.role !== 'student') {
        window.location.href = '/';
      }
    }).catch(() => window.location.href = '/');

    async function logout() {
      try {
        await fetch('/logout', { method: 'POST', credentials: 'same-origin' });
      } catch (e) {}
      window.location.href = '/';
    }

    async function markAttendance() {
      const code = document.getElementById('codeInput').value.trim();

      if (!code || code.length !== 5 || !/^\d{5}$/.test(code)) {
        alert('Please enter a valid 5-digit code');
        return;
      }

      try {
        const location = await locationHandler.getCurrentLocation();
        if (location.accuracy > 150) {
          alert(`GPS accuracy too poor (${Math.round(location.accuracy)}m). Please move to an open area and try again.`);
          return;
        }

        const validation = await locationHandler.validateAttendanceLocation(code, location.latitude, location.longitude, location.accuracy);
        if (!validation.isValid) {
          alert(validation.error || validation.message || 'Location check failed');
          return;
        }

        const response = await fetch('/mark-attendance-post', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({
            code,
            latitude: location.latitude,
            longitude: location.longitude,
            accuracy: location.accuracy,
          })
        });

        const msg = await response.text();
        alert(msg);

        if (response.ok) {
          document.getElementById('codeInput').value = '';
          loadMyAttendance();
          loadMyStats();
          loadSessionHistory();
        }
      } catch (error) {
        alert('Error marking attendance. Please try again.');
        console.error('Mark attendance error:', error);
      }
    }

    async function loadMyAttendance() {
      try {
        const response = await fetch('/my-attendance', { credentials: 'same-origin' });
        if (!response.ok) throw new Error('Failed to load');

        const data = await response.json();

        if (data.length === 0) {
          document.getElementById('myAttendance').innerHTML = '<p class="text-xs sm:text-sm text-gray-400">No attendance records yet.</p>';
          return;
        }

        const list = data.map(a => `
          <div class="flex items-start justify-between gap-2 p-2 sm:p-3 bg-white/5 rounded-lg">
            <div class="flex-1 min-w-0">
              <div class="font-semibold text-yellow-400 text-sm truncate">${a.subject || 'Lecture'}</div>
              <div class="text-xs text-gray-400 mt-1">${new Date(a.marked_at).toLocaleString()}</div>
            </div>
            <div class="text-xs font-semibold text-green-400 flex-shrink-0">✓</div>
          </div>
        `).join('');
        document.getElementById('myAttendance').innerHTML = list;
      } catch (error) {
        document.getElementById('myAttendance').innerHTML = '<p class="text-xs sm:text-sm text-red-400">Error loading attendance.</p>';
      }
    }

    async function loadMyStats() {
      try {
        const response = await fetch('/my-stats', { credentials: 'same-origin' });
        if (!response.ok) throw new Error('Failed to load stats');

        const data = await response.json();
        const monthlyNum = Number(data.monthly);
        const liveNum = Number(data.live);

        document.getElementById('monthlyPct').textContent = `${data.monthly}%`;
        document.getElementById('livePct').textContent = `${data.live}%`;

        document.getElementById('monthlyPct').style.color = monthlyNum >= 75 ? '#4CAF50' : '#E05555';
        document.getElementById('livePct').style.color = liveNum >= 75 ? '#4CAF50' : '#E05555';

        document.getElementById('monthlyDetail').textContent = `${data.monthlyAttended} of ${data.monthlyTotal} lectures this month`;
      } catch (error) {
        document.getElementById('monthlyDetail').textContent = 'Could not load stats.';
      }
    }

    async function loadSessionHistory() {
      try {
        const response = await fetch('/my-sessions', { credentials: 'same-origin' });
        if (!response.ok) throw new Error('Failed to load');

        const data = await response.json();

        if (data.length === 0) {
          document.getElementById('sessionHistory').innerHTML = '<p class="text-xs sm:text-sm text-gray-400">No sessions yet.</p>';
          return;
        }

        const rows = data.map(row => {
          const date = new Date(row.created_at);
          const status = row.present ? '✓ Present' : '✗ Absent';
          const statusColor = row.present ? 'text-green-400' : 'text-red-400';
          return `
            <div class="border-b border-white/10 pb-3 mb-3 last:border-b-0 last:pb-0 last:mb-0 text-xs sm:text-sm">
              <div class="font-semibold text-yellow-400">${row.subject || 'Lecture'}</div>
              <div class="text-gray-400 mt-1">${date.toLocaleDateString()} at ${date.toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'})}</div>
              <div class="${statusColor} font-semibold mt-1">${status}</div>
              <div class="text-gray-500 text-xs mt-1">${row.teacher_fname ? `Teacher: ${row.teacher_fname} ${row.teacher_lname}` : 'Teacher: TBD'}</div>
            </div>
          `;
        }).join('');

        document.getElementById('sessionHistory').innerHTML = `<div class="space-y-2">${rows}</div>`;
      } catch (error) {
        document.getElementById('sessionHistory').innerHTML = '<p class="text-xs sm:text-sm text-red-400">Error loading session history.</p>';
      }
    }

    async function loadAssignments() {
      try {
        const response = await fetch('/assignments', { credentials: 'same-origin' });
        if (!response.ok) throw new Error('Failed to load');

        const data = await response.json();

        if (data.length === 0) {
          document.getElementById('assignmentList').innerHTML = '<p class="text-xs sm:text-sm text-gray-400">No assignments yet.</p>';
          return;
        }

        const html = data.map(item => `
          <div class="p-3 sm:p-4 bg-white/5 rounded-lg border border-white/10">
            <div class="font-semibold text-yellow-400 text-sm">${item.title}</div>
            <div class="text-xs sm:text-sm text-gray-300 mt-2">${item.description || 'No description'}</div>
            <div class="text-xs text-gray-500 mt-3">Due: ${item.due_date ? new Date(item.due_date).toLocaleDateString() : 'No deadline'}</div>
          </div>
        `).join('');
        document.getElementById('assignmentList').innerHTML = html;
      } catch (error) {
        document.getElementById('assignmentList').innerHTML = '<p class="text-xs sm:text-sm text-red-400">Error loading assignments.</p>';
      }
    }

    // Load all data on page load
    loadMyAttendance();
    loadMyStats();
    loadSessionHistory();
    loadAssignments();
  </script>
  <!-- Location Handler -->
<script src="/js/locationHandler.js"></script>

<script>
  // Check location permission on page load if student logged in
  document.addEventListener('DOMContentLoaded', async function() {
    // Check if we're on a page that requires authentication
    const authToken = document.querySelector('meta[name="auth-token"]');
    const isStudentPage = window.location.pathname.includes('student');
    
    if (isStudentPage && authToken) {
      try {
        console.log('Checking location permission status...');
        const status = await locationHandler.checkPermissionStatus();
        
        if (status.needsPermission) {
          console.log('Location permission needed - showing popup');
          locationHandler.showLocationPermissionPopup();
        } else {
          console.log('Location permission already granted');
        }
      } catch (error) {
        console.error('Error checking permission:', error);
      }
    }
  });
</script>
</body>
</html>
